<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>健康新聞諮詢小幫手</title>
  <style>
    :root { color-scheme: light; --ink:#202c28; --muted:#69746e; --line:#dfe5df; --green:#285e4b; --pale:#eef4ef; --paper:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7f4; color:var(--ink); font:16px/1.65 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
    .layout { min-height:100vh; display:grid; grid-template-columns:280px minmax(0,1fr); }
    aside { padding:30px 24px; background:#edf2ed; border-right:1px solid var(--line); }
    .brand { display:flex; gap:12px; align-items:center; margin-bottom:34px; }
    .mark { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:var(--green); color:white; font-size:23px; }
    h1,h2,p { margin-top:0; }
    h1 { font-size:18px; line-height:1.35; margin-bottom:3px; }
    .sub,.hint,.model { color:var(--muted); font-size:13px; }
    .side-title { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 8px; }
    .notice { border:1px solid #d7e2d8; background:#f7faf7; border-radius:14px; padding:14px; font-size:13px; }
    .notice strong { display:block; margin-bottom:5px; }
    main { display:flex; flex-direction:column; min-width:0; max-width:1100px; width:100%; margin:0 auto; padding:32px clamp(18px,5vw,64px) 22px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    header h2 { font-size:24px; margin:0 0 4px; }
    .model { white-space:nowrap; border:1px solid var(--line); border-radius:999px; padding:5px 11px; background:#fff; }
    #chat { flex:1; min-height:260px; padding:28px 0; }
    .welcome { margin:5vh auto; max-width:560px; text-align:center; }
    .welcome-icon { font-size:34px; }
    .welcome h3 { margin:8px 0; font-size:22px; }
    .welcome p { color:var(--muted); }
    .bubble { max-width:820px; margin:0 auto 20px; }
    .bubble.user { display:flex; justify-content:flex-end; }
    .bubble.user .text { max-width:78%; background:var(--green); color:#fff; border-radius:18px 18px 4px 18px; padding:12px 16px; white-space:pre-wrap; }
    .bubble.assistant .text { white-space:pre-wrap; }
    .bubble.error .text { color:#8b2e26; background:#fff1ef; padding:12px 15px; border-radius:12px; }
    .sources { margin-top:15px; border-top:1px solid var(--line); padding-top:13px; }
    .sources h4 { margin:0 0 8px; font-size:14px; }
    .source { border:1px solid var(--line); border-radius:12px; background:var(--paper); padding:11px 13px; margin:8px 0; font-size:13px; }
    .source a { color:var(--green); font-weight:650; text-decoration:none; }
    .source a:hover { text-decoration:underline; }
    .source .date { color:var(--muted); margin-top:3px; }
    .composer { position:sticky; bottom:0; background:#f5f7f4; padding:13px 0 0; }
    .options { display:flex; align-items:center; gap:9px; margin:0 0 10px 3px; font-size:13px; color:#46534c; }
    .options input { accent-color:var(--green); width:16px; height:16px; }
    .input-wrap { display:flex; align-items:flex-end; gap:10px; padding:10px; border:1px solid #cfd8d0; background:#fff; border-radius:18px; box-shadow:0 5px 20px #263c2c0c; }
    textarea { border:0; outline:0; resize:vertical; min-height:48px; max-height:180px; flex:1; padding:10px; font:inherit; color:var(--ink); background:transparent; }
    button { border:0; border-radius:12px; padding:11px 17px; min-width:78px; background:var(--green); color:#fff; font:inherit; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .footnote { color:var(--muted); font-size:11px; text-align:center; margin:9px 0 0; }
    @media(max-width:760px) { .layout { display:block; } aside { display:none; } main { padding:20px 16px; min-height:100vh; } header h2 { font-size:20px; } .model { font-size:11px; } #chat { padding-top:20px; } }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><div class="mark">✚</div><div><h1>健康新聞<br>諮詢小幫手</h1><div class="sub">以健康新聞為檢索依據</div></div></div>
    <div class="side-title">使用說明</div>
    <div class="notice"><strong>從新聞資料找答案</strong>提出問題後，系統會搜尋健康醫療網新聞摘要，並由本機模型整理回答。你可以用下方選項控制本輪是否檢索。</div>
    <div class="side-title">提醒</div>
    <div class="notice">回答用於新聞資訊整理，不取代醫師診斷或個人醫療建議。若資料庫沒有相關新聞，系統會說明來源不足。</div>
  </aside>
  <main>
    <header><div><h2>健康新聞問答</h2><div class="sub">根據已收集的健康醫療網新聞整理資訊</div></div><div class="model">本機模型 · {{ model_name }}</div></header>
    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome"><div class="welcome-icon">🌿</div><h3>今天想了解什麼健康新聞？</h3><p>輸入問題開始對話。每則回答會列出檢索到的新聞來源。</p></div>
    </section>
    <form class="composer" id="form">
      <label class="options"><input id="retrieval" type="checkbox" checked><span>本輪使用新聞檢索</span><span class="hint">關閉後會保留對話脈絡，但不查新聞</span></label>
      <div class="input-wrap"><textarea id="question" placeholder="輸入你的問題…" aria-label="輸入問題" required></textarea><button id="send" type="submit">送出</button></div>
      <p class="footnote">健康資訊僅供參考；有症狀或治療問題，請諮詢合格醫療專業人員。</p>
    </form>
  </main>
</div>
<script>
  const form = document.getElementById('form');
  const questionInput = document.getElementById('question');
  const chat = document.getElementById('chat');
  const send = document.getElementById('send');
  const history = [];

  function addUser(text) {
    document.getElementById('welcome')?.remove();
    const row = document.createElement('div'); row.className = 'bubble user';
    const bubble = document.createElement('div'); bubble.className = 'text'; bubble.textContent = text;
    row.appendChild(bubble); chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  }
  function addAssistant(result) {
    const row = document.createElement('div'); row.className = 'bubble assistant';
    const text = document.createElement('div'); text.className = 'text'; text.textContent = result.answer;
    row.appendChild(text);
    const sources = document.createElement('div'); sources.className = 'sources';
    const title = document.createElement('h4'); title.textContent = '參考新聞'; sources.appendChild(title);
    if (!result.sources?.length) {
      const none = document.createElement('div'); none.className = 'hint';
      none.textContent = result.used_retrieval ? '沒有找到可用的新聞來源。' : '本輪未檢索新聞來源。';
      sources.appendChild(none);
    } else {
      result.sources.forEach(source => {
        const card = document.createElement('div'); card.className = 'source';
        const link = document.createElement('a'); link.href = source.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = source.title;
        const date = document.createElement('div'); date.className = 'date'; date.textContent = `文章新增時間：${source.added_at || '資料未提供'}`;
        card.append(link, date); sources.appendChild(card);
      });
    }
    row.appendChild(sources); chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  }
  function addError(message) {
    const row = document.createElement('div'); row.className = 'bubble error';
    const text = document.createElement('div'); text.className = 'text'; text.textContent = message;
    row.appendChild(text); chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const question = questionInput.value.trim();
    if (!question) return;
    addUser(question); questionInput.value = ''; send.disabled = true; send.textContent = '思考中';
    try {
      const response = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question, history, use_retrieval: document.getElementById('retrieval').checked})
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '問答服務目前無法使用。');
      addAssistant(result);
      history.push({role:'user', content:question}, {role:'assistant', content:result.answer});
    } catch (error) { addError(error.message); }
    finally { send.disabled = false; send.textContent = '送出'; questionInput.focus(); }
  });
  questionInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
  });
</script>
</body>
</html>
